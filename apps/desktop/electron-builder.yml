appId: com.novelwriter.app
productName: 长篇写作
directories:
  output: release
files:
  - apps/desktop/dist/**/*
  - packages/*/dist/**/*
  - node_modules/**/*
  - "!apps/desktop/dist/renderer/src/**"
win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: "${productName}-Setup-${version}.${ext}"
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  artifactName: "${productName}-${version}-${arch}.${ext}"
linux:
  target:
    - target: AppImage
      arch:
        - x64
  artifactName: "${productName}-${version}.${ext}"
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
